name: Validate FORJA
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check engine.js
          node --check sw.js
          node --check muay.js
          node --check calendar.js
          node --check flex.js
          node --check dose.js
      - name: Validate manifest and deployed assets
        run: python3 tests/check_assets.py
      - name: Test progression rules
        run: node --test tests/engine.test.cjs tests/muay.test.cjs tests/calendar.test.cjs tests/flex.test.cjs tests/dose.test.cjs
      - name: Install browser smoke dependencies
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser smoke - strength persistence and radar
        run: |
          python3 tests/smoke_browser.py
          python3 tests/smoke_persistence.py
          python3 tests/smoke_strength.py
          python3 tests/smoke_muay.py
          python3 tests/smoke_calendar.py
          python3 tests/smoke_flex.py
      - name: Upload Muay screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forja-visual-qa
          path: |
            screenshots/muay-*.png
            screenshots/calendar-*.png
            screenshots/flex-*.png
          if-no-files-found: warn
          retention-days: 3
