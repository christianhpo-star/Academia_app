name: Validate FORJA
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check engine.js
          node --check sw.js
          node --check muay.js
          node --check calendar.js
          node --check flex.js
          node --check catalog-session.js
          node --check dose.js
          node --check focus.js
          node --check catalog-advice.js
          node --check body-measures.js
          node --check activity.js
          node --check health-import.js
          node --check nutrition-goals.js
          node --check goal-planner.js
          node --check reminders.js
          node --check daily-routine.js
          node --check nutrition.js
          node --check nutrition-catalog.js
          node --check nutrition-prescription-data.js
          node --check nutrition-presets.js
          node --check nutrition-balance.js
          node --check nutrition-ui.js
          node --check evolution-dashboard.js
          node --check performance-trends.js
          node --check exercise-anatomy.js
      - name: Validate manifest and deployed assets
        run: python3 tests/check_assets.py
      - name: Test progression rules
        run: node --test tests/daily-routine.test.cjs tests/reminders.test.cjs tests/goal-planner.test.cjs tests/health-import.test.cjs tests/activity.test.cjs tests/nutrition-goals.test.cjs tests/nutrition-balance.test.cjs tests/engine.test.cjs tests/muay.test.cjs tests/calendar.test.cjs tests/flex.test.cjs tests/catalog-session.test.cjs tests/catalog-expansion.test.cjs tests/exercise-anatomy.test.cjs tests/dose.test.cjs tests/focus.test.cjs tests/catalog-advice.test.cjs tests/body-measures.test.cjs tests/nutrition.test.cjs tests/nutrition-catalog.test.cjs tests/joelho-frango.test.cjs tests/nutrition-presets.test.cjs tests/performance-trends.test.cjs tests/nutrition-ui.test.cjs tests/evolution-dashboard.test.cjs
      - name: Install browser smoke dependencies
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser smoke - protect populated local histories
        run: python3 tests/smoke_recovery.py
      - name: Browser smoke - nutrition diary and goals
        run: python3 tests/smoke_nutrition.py
      - name: Browser smoke - strength group volume and evolution
        run: |
          python3 tests/smoke_browser.py
          python3 tests/smoke_persistence.py
          python3 tests/smoke_strength.py
          python3 tests/smoke_muay.py
          python3 tests/smoke_calendar.py
          python3 tests/smoke_flex.py
          python3 tests/smoke_dose.py
          python3 tests/smoke_ui.py
          python3 tests/smoke_navigation.py
          python3 tests/smoke_goal.py
          python3 tests/smoke_focus.py
          python3 tests/smoke_catalog.py
          python3 tests/smoke_catalog_detail.py
          python3 tests/smoke_anatomy.py
          python3 tests/smoke_body.py
          python3 tests/smoke_activity.py
          python3 tests/smoke_health.py
          python3 tests/smoke_reminders.py
          python3 tests/smoke_daily_routine.py
          python3 tests/smoke_history.py
      - name: Upload isolated PR source for diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: forja-source-debug
          path: |
            *.html
            *.js
            *.css
            *.webmanifest
            tests/*.py
            tests/*.cjs
            icons/*.png
          retention-days: 1
      - name: Upload Muay screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forja-visual-qa
          path: |
            screenshots/muay-*.png
            screenshots/calendar-*.png
            screenshots/flex-*.png
            screenshots/dose-*.png
            screenshots/blocks-*.png
            screenshots/previous-series-*.png
            screenshots/focus-*.png
            screenshots/catalog-*.png
            screenshots/anatomy-*.png
            screenshots/body-*.png
            screenshots/nutrition-*.png
            screenshots/evolution-*.png
            screenshots/navigation-*.png
          if-no-files-found: warn
          retention-days: 3
